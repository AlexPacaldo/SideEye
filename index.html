<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Side Eye — a social deduction party game. One secret word, hidden impostors, and a race to spot the liar."
    />
    <meta name="theme-color" content="#ff4d6d" />
    <title>Side Eye — Social Deduction Party Game</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sideeye.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
    <style>
      html {
        background: #fff6ef;
      }
      html[data-theme='dark'] {
        background: #16121d;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
